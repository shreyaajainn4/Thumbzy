services:
  - type: web
    name: thumbzy-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets: Render will ask you to enter these when you create the Blueprint.
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Your Vercel client URL, no trailing slash (used for CORS).
      - key: CLIENT_URL
        sync: false
